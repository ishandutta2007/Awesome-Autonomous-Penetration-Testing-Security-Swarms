<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }
    
    /* Dynamic Animations */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.65; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(450px); opacity: 0; }
    }
    @keyframes swarmOrbit {
      0% { transform: rotate(0deg) translateX(35px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(35px) rotate(-360deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }

    .anim-orb-1 { animation: pulseOrb 8s infinite ease-in-out; transform-origin: 200px 100px; }
    .anim-orb-2 { animation: pulseOrb 10s infinite ease-in-out reverse; transform-origin: 1000px 300px; }
    .anim-scan { animation: scanline 6s linear infinite; }
    .anim-dash { stroke-dasharray: 6, 6; animation: dashMove 5s linear infinite; }
    .anim-swarm { animation: swarmOrbit 7s linear infinite; transform-origin: 1050px 120px; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#cyberGrid)" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle class="anim-orb-1" cx="200" cy="90" r="130" fill="url(#purpleGlow)" filter="url(#glowCyan)" />
  <circle class="anim-orb-2" cx="1020" cy="300" r="140" fill="url(#neonRed)" opacity="0.15" filter="url(#glowRed)" />
  <circle cx="600" cy="380" r="180" fill="#00f2fe" opacity="0.04" />

  <!-- Subtle Cyber Scanning Beam -->
  <rect class="anim-scan" x="0" y="0" width="1200" height="3" fill="url(#cyberCyan)" />

  <!-- Animated Network Lines & Swarm Node Elements in Lower/Side Visual Areas -->
  <g opacity="0.35">
    <path class="anim-dash" d="M 50 350 L 300 350 L 450 380 L 750 380 L 900 340 L 1150 340" fill="none" stroke="#00f2fe" stroke-width="1.5" />
    <path class="anim-dash" d="M 950 50 L 1050 120 L 1150 80" fill="none" stroke="#ff0844" stroke-width="1.5" />
    
    <!-- Central decorative node -->
    <circle cx="1050" cy="120" r="8" fill="#ff0844" filter="url(#glowRed)" />
    <!-- Orbiting agent node -->
    <circle class="anim-swarm" cx="1050" cy="120" r="4.5" fill="#00f2fe" filter="url(#glowCyan)" />
  </g>

  <!-- FOREGROUND: Content Cards and Typography (Guaranteed Top Layer, Z-Index Front) -->
  <g id="foreground-content">
    <!-- Category Pill -->
    <g transform="translate(80, 52)">
      <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#00f2fe" filter="url(#glowCyan)" />
      <text x="28" y="20" class="badge-text" fill="#38bdf8">OFFENSIVE AI &amp; SWARMS</text>
    </g>

    <!-- Main Title -->
    <text x="80" y="132" class="title-text">
      Autonomous Penetration Testing
    </text>
    <text x="80" y="180" class="title-text" fill="url(#cyberCyan)">
      &amp; Multi-Agent Security Swarms
    </text>

    <!-- Subtitle / Tagline -->
    <text x="80" y="224" class="subtitle-text">
      Curated index of autonomous red-teaming agents, swarm architectures, continuous security validation,
    </text>
    <text x="80" y="248" class="subtitle-text">
      and breach-and-attack simulation (BAS) platforms — prioritized for self-hosted and open-source tools.
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(80, 285)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
        <text x="20" y="24" class="badge-text">⚡ Multi-Agent Swarms</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="190" height="38" rx="8" fill="#0f172a" stroke="#7928ca" stroke-width="1.2" />
        <text x="20" y="24" class="badge-text">🛡️ Autonomous Pentesting</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(400, 0)">
        <rect width="190" height="38" rx="8" fill="#0f172a" stroke="#e11d48" stroke-width="1.2" />
        <text x="20" y="24" class="badge-text">🎯 AI Red Teaming</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(605, 0)">
        <rect width="180" height="38" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
        <text x="20" y="24" class="badge-text">🔓 100% Authorized</text>
      </g>
    </g>
  </g>
</svg>